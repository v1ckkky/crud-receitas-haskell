<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Receita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1 id="titulo-receita">Carregando...</h1>
    <a href="index.html" class="btn-back" id="btn-back">← Voltar</a>
</header>

<div class="recipe-card">
    <div class="info-grid">
        <div class="info-box" id="box-category"></div>
        <div class="info-box" id="box-time"></div>
        <div class="info-box" id="box-difficulty"></div>
        <div class="info-box" id="box-rating"></div>
    </div>

    <h2>Ingredientes</h2>
    <div id="ingredientes" class="section-text">Carregando...</div>

    <h2>Modo de Preparo</h2>
    <div id="modoPreparo" class="section-text">Carregando...</div>

    <div class="buttons">
        <a id="btn-edit" class="btn-edit">Editar receita</a>
        <button id="btn-delete" class="btn-delete">Excluir receita</button>
    </div>
</div>

<script src="receita.js"></script>
</body>
</html>
